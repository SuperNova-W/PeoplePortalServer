name: Deploy Landing v3 to Cloudflare Pages

on:
  push:
    branches: ["master"]
    paths:
      - "landing-v3/**"
  workflow_dispatch:

concurrency:
  group: "pages-landing-v3"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: landing-v3/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('landing-v3/package-lock.json') }}-${{ hashFiles('landing-v3/**.[jt]s', 'landing-v3/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('landing-v3/package-lock.json') }}-

      - name: Build with Nx
        run: ./nx build landing-v3

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=appdevclub-landing --branch=master
          workingDirectory: landing-v3