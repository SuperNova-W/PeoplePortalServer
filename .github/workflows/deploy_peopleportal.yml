name: Build and Deploy People Portal

on:
  push:
    branches: ["master"]
    paths:
      - "peopleportal/**"

  workflow_dispatch:

concurrency:
  group: "deploy-peopleportal"
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # You can adjust if a specific version is required

      - name: Build with Nx
        # Builds both the pplserver and pplui to generate the dist folders
        run: ./nx run-many -t build -p pplserver pplui

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./peopleportal
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            candiedoperation/people-portal:latest
            candiedoperation/people-portal:${{ github.event.client_payload.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=inline
